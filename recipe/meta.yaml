{% set version = load_file_contents("VERSION").strip() %}

package:
  name: metametro
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - metametro = metametro.cli:main

requirements:
  host:
    - python 3.12
    - pip
    - setuptools
  run:
    - python 3.12
    - numpy
    - pyyaml

test:
  imports:
    - metametro
  commands:
    - metametro --version

about:
  home: https://github.com/dsmutin/MetaMetro
  license: MIT
  license_file: LICENSE
  summary: "Metagenomic assembly totally coloured graph representations"
