# Coloured Graph Tensor (CGT), schema 1.0.
# Feature registries and CSC are optional. CSR remains the stored topology.
# A directory that omits the registries still loads. CSC is not a file.
schema_version: "1.0"
contract: cdbg_to_cgt
contract_version: "1.0"
topology: csr
dense_ids: "0 .. N-1"
node_feature_dtype: float32
edge_feature_dtype: float32
required_metadata:
  - schema_version
  - num_nodes
  - num_edges
  - node_feature_names
  - edge_feature_names
  - node_feature_dtype
  - edge_feature_dtype
  - topology
  - source
optional_metadata:
  - node_feature_registry
  - edge_feature_registry
optional_arrays:
  - node_color_weights.npy
  - edge_color_weights.npy
colour_weights: >-
  Optional float32 scores on the same columns as the uint8 colour mask.
  Absent files mean the graph has no probability channel. A weight is in
  [0, 1]. A positive weight requires mask value 1. The channel is not a
  feature matrix.
forbidden:
  - dense_adjacency
  - python_objects_per_node
  - required_dna_sequence
  - required_csc
