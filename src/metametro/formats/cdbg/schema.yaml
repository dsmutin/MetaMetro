# ToCUMG (totally coloured universal metagenomic graph), stored as CDBG schema 1.0.
# graph_type is preserved. k is required only for graph_type de_bruijn.
schema_version: "1.0"
contract: cfa_to_cdbg
contract_version: "1.0"
mandatory_members:
  - unitigs
  - links
  - mapping
optional_members:
  - colors
unitig_required:
  - unitig_id
  - sequence
  - color_set
mapping_direction: cdbg_unitig_id_to_cfa_node_ids
compaction: >-
  Merge an edge u->v when u has out-degree 1, v has in-degree 1, u is not v,
  and the edge orientation is ++ or absent. The overlap is k-1 for
  graph_type de_bruijn, the edge overlap column when present, or metadata
  overlap otherwise. A mismatch is refused. graph_type is unchanged.
  A graph with no overlap contract keeps identity unitigs of that same type.
  A unitig of N CFA members stores N-1 internal edge ids in member order.
  mapping ordinal i is member i of that unitig.
optional_annotation_sidecar:
  directory: annotations
  version: "1.0"
  note: >-
    Optional files. Absent when the CDBG has no annotation layers. The
    sidecar is columnar (one table per namespace, feature, and target
    type). It does not change unitig, link, colour, sequence, or mapping
    semantics and it is not a dense feature matrix. Schema remains 1.0.
  target_types:
    - node
    - edge
    - internal_node
    - internal_edge
  files:
    - layers.yaml
    - "<namespace>__<feature>__<target_type>.tsv"
    - "<namespace>__<feature>__<target_type>.ids.tsv"
    - "<namespace>__<feature>__<target_type>.npy"
